name: Build Windows App

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Install Fyne
        run: |
          go install fyne.io/fyne/v2/cmd/fyne@latest
          $env:PATH = "$env:GOPATH\bin;$env:PATH"
      
      - name: Build GUI
        working-directory: gui
        run: |
          go mod tidy
          fyne package -os windows -icon ../README.md
      
      - name: Upload GUI App
        uses: actions/upload-artifact@v4
        with:
          name: SmirnovTorrent-GUI
          path: gui/SmirnovTorrent.exe
