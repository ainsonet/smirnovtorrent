name: Build Windows App

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build Release Binary
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Build Desktop Executable
        run: go build -ldflags "-H windowsgui -s -w" -o SmirnovTorrent.exe .
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmirnovTorrent-Windows-x64
          path: SmirnovTorrent.exe
