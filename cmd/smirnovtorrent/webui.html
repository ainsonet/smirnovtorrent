<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmirnovTorrent - Торрент-клиент</title>
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-hover: #0284c7;
      --bg: #0f172a;
      --bg-secondary: #1e293b;
      --card: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    [data-theme="light"] {
      --primary: #0ea5e9;
      --primary-hover: #0284c7;
      --bg: #ffffff;
      --bg-secondary: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    header .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
    }

    header .theme-toggle:hover {
      background: var(--border);
    }

    header .logo {
      width: 100px;
      height: 100px;
      margin-bottom: 15px;
      border-radius: 12px;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .add-torrent {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .add-torrent h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: var(--text);
    }

    .input-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 14px 18px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      padding: 14px 28px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-select {
      background: var(--bg-secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-select:hover {
      background: var(--border);
    }

    button:active {
      transform: translateY(0);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .downloads {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .downloads h2 {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .download-item {
      background: var(--bg-secondary);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .download-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .download-name {
      font-weight: 600;
      font-size: 1rem;
      flex: 1;
    }

    .download-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-downloading {
      background: rgba(99, 102, 241, 0.2);
      color: var(--primary);
    }

    .status-paused {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }

    .status-seeding {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .progress-bar {
      height: 8px;
      background: var(--card);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #a855f7);
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .download-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .info-item span:first-child {
      color: var(--text-muted);
    }

    .info-item span:last-child {
      color: var(--text);
      font-weight: 500;
    }

    .download-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .download-actions button {
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    .btn-pause {
      background: var(--warning);
    }

    .btn-pause:hover {
      background: #d97706;
    }

    .btn-resume {
      background: var(--success);
    }

    .btn-resume:hover {
      background: #059669;
    }

    .btn-remove {
      background-color: #ef4444;
      color: white;
    }

    .btn-remove:hover {
      background-color: #dc2626;
    }

    .btn-open-folder {
      background-color: #8b5cf6;
      color: white;
    }

    .btn-open-folder:hover {
      background-color: #7c3aed;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <button class="theme-toggle" onclick="toggleTheme()" title="Переключить тему">🌙</button>
      <img src="/logo2.png" alt="SmirnovTorrent" class="logo" onerror="this.style.display='none'">
      <h1>SmirnovTorrent</h1>
      <p>Лёгкий BitTorrent клиент v1.0.0</p>
    </header>

    <section class="add-torrent">
      <h2>Добавить торрент</h2>
      <div class="input-group">
        <input type="text" id="torrentInput" placeholder="Или вставьте путь к .torrent файлу..." />
        <input type="file" id="fileInput" accept=".torrent" style="display: none;" onchange="handleFileSelect(event)" />
        <button class="btn-select" onclick="document.getElementById('fileInput').click()">📁 Обзор</button>
        <button onclick="addTorrent()">Добавить</button>
      </div>
      <div id="fileInfo" style="margin-top: 10px; color: var(--text-muted); font-size: 0.9rem;"></div>
    </section>

    <section class="stats">
      <div class="stat-card">
        <div class="stat-value" id="downloadSpeed">0 КБ/с</div>
        <div class="stat-label">Загрузка</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="uploadSpeed">0 КБ/с</div>
        <div class="stat-label">Отдача</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activePeers">0</div>
        <div class="stat-label">Пиры</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activeTorrents">0</div>
        <div class="stat-label">Торренты</div>
      </div>
    </section>

    <section class="downloads">
      <h2>Активные торренты</h2>
      <div id="downloadsList">
        <div class="empty-state">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
                  d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
          <p>Нет активных загрузок</p>
        </div>
      </div>
    </section>
  </div>

    <script>
    let updateInterval = null;
    let selectedFilePath = null;
    let currentTheme = 'dark';

    // Toggle theme
    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', currentTheme);
      document.querySelector('.theme-toggle').textContent = currentTheme === 'dark' ? '☀️' : '🌙';
    }

    // Handle file selection
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        selectedFilePath = file;
        document.getElementById('torrentInput').value = file.name;
        document.getElementById('fileInfo').textContent = `Selected: ${file.name} (${formatBytes(file.size)})`;
      }
    }

// Add torrent
    async function addTorrent() {
      const input = document.getElementById('torrentInput');
      const inputValue = input.value.trim();
      
      if (!inputValue) {
        alert('Пожалуйста, выберите .torrent файл');
        return;
      }

      try {
        // Если файл был выбран через Browse, отправляем его как FormData
        if (selectedFilePath && selectedFilePath instanceof File) {
          const formData = new FormData();
          formData.append('torrent', selectedFilePath);
          
          console.log('Загрузка торрент файла:', selectedFilePath.name);
          
          const response = await fetch('/api/add', {
            method: 'POST',
            body: formData
          });

          if (response.ok) {
            const data = await response.json();
            console.log('Torrent added:', data);
            input.value = '';
            selectedFilePath = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('fileInfo').textContent = '';
            setTimeout(updateStats, 500);
          } else {
            const error = await response.text();
            console.error('Ошибка добавления торрента:', error);
            alert('Ошибка: ' + error);
          }
          return;
        }
        
        // Иначе используем путь из поля ввода
        console.log('Добавление торрента из пути:', inputValue);
        
        const response = await fetch('/api/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: inputValue })
        });

        if (response.ok) {
          const data = await response.json();
          console.log('Торрент добавлен:', data);
          input.value = '';
          selectedFilePath = null;
          document.getElementById('fileInput').value = '';
          document.getElementById('fileInfo').textContent = '';
          setTimeout(updateStats, 500);
        } else {
          const error = await response.text();
          console.error('Ошибка добавления торрента:', error);
          alert('Ошибка: ' + error);
        }
      } catch (err) {
        console.error('Не удалось добавить торрент:', err);
        alert('Не удалось добавить торрент: ' + err.message);
      }
    }
          
    // Pause torrent
    async function pauseTorrent() {
      try {
        await fetch('/api/pause', { method: 'POST' });
        updateStats();
      } catch (err) {
        console.error('Ошибка паузы:', err);
      }
    }

    // Resume torrent
    async function resumeTorrent() {
      try {
        await fetch('/api/resume', { method: 'POST' });
        updateStats();
      } catch (err) {
        console.error('Ошибка возобновления:', err);
      }
    }

    // Remove torrent
    async function removeTorrent() {
      if (!confirm('Удалить торрент и остановить загрузку?')) return;

      try {
        await fetch('/api/remove', { method: 'POST' });
        setTimeout(updateStats, 500);
      } catch (err) {
        console.error('Не удалось удалить торрент:', err);
      }
    }

    // Open folder with downloaded files
    async function openFolder() {
      try {
        const response = await fetch('/api/open-folder', { method: 'POST' });
        const data = await response.json();
        console.log('Папка открыта:', data.path);
        // Не показываем alert об успехе - папка уже открылась
      } catch (err) {
        console.error('Не удалось открыть папку:', err);
        // Даже если ошибка в fetch, explorer мог открыться
        console.log('Explorer мог открыться несмотря на ошибку');
      }
    }
          
    // Update statistics
    async function updateStats() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();
        
        // Debug output
        console.log('Статус ответа:', JSON.stringify(data));
        
        // Handle null/undefined values
        const downloadSpeed = data.downloadSpeed || 0;
        const uploadSpeed = data.uploadSpeed || 0;
        const activePeers = data.activePeers || 0;
        const progress = data.progress || 0;
        const downloaded = data.downloaded || 0;
        const uploaded = data.uploaded || 0;
        const totalSize = data.totalSize || 0;
        const status = data.status || 'stopped';
        const torrentName = data.torrentName || '';
        
        // Debug - show status in console
        console.log('Статус:', status, 'Прогресс:', progress, 'Всего:', totalSize);
        
        // Update stats cards
        document.getElementById('downloadSpeed').textContent = formatSpeed(downloadSpeed);
        document.getElementById('uploadSpeed').textContent = formatSpeed(uploadSpeed);
        document.getElementById('activePeers').textContent = activePeers;
        document.getElementById('activeTorrents').textContent = (status === 'downloading' || status === 'completed' || status === 'seeding') ? '1' : '0';
        
        // Update downloads list
        const container = document.getElementById('downloadsList');
        
        if (status === 'stopped' || status === 'initializing' || !torrentName) {
          container.innerHTML = `
            <div class="empty-state">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
                      d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
              </svg>
              <p>Нет активных загрузок</p>
            </div>
          `;
          return;
        }
        
        const displayProgress = Math.min(progress, 99.9);
        
        // Показываем статус seeding если 100%
        let displayStatus = status;
        if (progress >= 100 && (status === 'downloading' || status === 'completed')) {
          displayStatus = 'seeding';
        }
        
        container.innerHTML = `
          <div class="download-item">
            <div class="download-header">
              <div class="download-name">${escapeHtml(torrentName)}</div>
              <span class="download-status status-${displayStatus}">${displayStatus}</span>
            </div>
            
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${displayProgress}%"></div>
            </div>
            
            <div class="download-info">
              <div class="info-item">
                <span>↓</span> <span>${formatBytes(downloaded)} / ${formatBytes(totalSize)}</span>
              </div>
              <div class="info-item">
                <span>↑</span> <span>${formatBytes(uploaded)}</span>
              </div>
              <div class="info-item">
                <span>Peers:</span> <span>${activePeers}</span>
              </div>
              <div class="info-item">
                <span>Speed:</span> <span>${formatSpeed(downloadSpeed)}</span>
              </div>
            </div>
            
            <div class="download-actions">
              ${status === 'downloading' && progress < 100
                ? `<button class="btn-pause" onclick="pauseTorrent()">Пауза</button>`
                : progress < 100
                  ? `<button class="btn-resume" onclick="resumeTorrent()">Возобновить</button>`
                  : `<span style="color: var(--success); font-weight: 600; padding: 8px 0;">✓ Завершено</span>`
              }
              ${progress >= 100 
                ? `<button class="btn-open-folder" onclick="openFolder()">📁 Открыть папку</button>` 
                : ''
              }
              <button class="btn-remove" onclick="removeTorrent()">Удалить</button>
            </div>
          </div>
        `;
      } catch (err) {
        console.error('Ошибка обновления:', err);
      }
    }
          
    // Utility functions
    function formatSpeed(bytes) {
      if (bytes < 1024) return bytes + ' Б/с';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ/с';
      return (bytes / (1024 * 1024)).toFixed(1) + ' МБ/с';
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' Б';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' МБ';
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' ГБ';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Enter key to add torrent
    document.getElementById('torrentInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTorrent();
      }
    });

    // Auto-update every 2 seconds
    updateInterval = setInterval(updateStats, 2000);
    updateStats();
    </script>
</body>
</html>
