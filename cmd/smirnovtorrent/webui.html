<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmirnovTorrent</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #ffffff;
      --bg-secondary: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 15px;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .add-torrent {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .add-torrent h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: var(--text);
    }

    .input-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 14px 18px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      padding: 14px 28px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-select {
      background: var(--bg-secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-select:hover {
      background: var(--border);
    }

    button:active {
      transform: translateY(0);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .downloads {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .downloads h2 {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .download-item {
      background: var(--bg-secondary);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .download-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .download-name {
      font-weight: 600;
      font-size: 1rem;
      flex: 1;
    }

    .download-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-downloading {
      background: rgba(99, 102, 241, 0.2);
      color: var(--primary);
    }

    .status-paused {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }

    .progress-bar {
      height: 8px;
      background: var(--card);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #a855f7);
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .download-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .info-item span:first-child {
      color: var(--text-muted);
    }

    .info-item span:last-child {
      color: var(--text);
      font-weight: 500;
    }

    .download-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .download-actions button {
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    .btn-pause {
      background: var(--warning);
    }

    .btn-pause:hover {
      background: #d97706;
    }

    .btn-resume {
      background: var(--success);
    }

    .btn-resume:hover {
      background: #059669;
    }

    .btn-remove {
      background: #ef4444;
    }

    .btn-remove:hover {
      background: #dc2626;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="logo.png" alt="SmirnovTorrent" class="logo" onerror="this.style.display='none'">
      <h1>SmirnovTorrent</h1>
      <p>Lightweight BitTorrent Client v1.0.0</p>
    </header>

    <section class="add-torrent">
      <h2>Add Torrent</h2>
      <div class="input-group">
        <input type="text" id="torrentInput" placeholder="Paste magnet link or .torrent path..." />
        <button class="btn-select" onclick="selectFile()">📁 Browse</button>
        <button onclick="addTorrent()">Add Torrent</button>
      </div>
    </section>

    <section class="stats">
      <div class="stat-card">
        <div class="stat-value" id="downloadSpeed">0 KB/s</div>
        <div class="stat-label">Download</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="uploadSpeed">0 KB/s</div>
        <div class="stat-label">Upload</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activePeers">0</div>
        <div class="stat-label">Peers</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activeTorrents">0</div>
        <div class="stat-label">Torrents</div>
      </div>
    </section>

    <section class="downloads">
      <h2>Active Torrents</h2>
      <div id="downloadsList">
        <div class="empty-state">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
                  d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
          <p>No active torrents</p>
        </div>
      </div>
    </section>
  </div>

    <script>
    let updateInterval = null;
    let selectedFilePath = null;

    // Select file
    function selectFile() {
      // Для демо просто показываем сообщение
      // В реальной версии здесь будет file input
      const input = document.getElementById('torrentInput');
      input.value = 'C:\\Users\\User\\Downloads\\example.torrent';
      selectedFilePath = input.value;
    }

    // Add torrent
    async function addTorrent() {
      const input = document.getElementById('torrentInput');
      const value = input.value.trim();
      
      if (!value) {
        alert('Please enter a magnet link or .torrent path');
        return;
      }

      try {
        const response = await fetch('/api/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            path: value,
            size: 524288000 // 500MB demo
          })
        });

        if (response.ok) {
          const data = await response.json();
          console.log('Torrent added:', data);
          input.value = '';
          selectedFilePath = null;
          updateStats();
        } else {
          const error = await response.text();
          alert('Error: ' + error);
        }
      } catch (err) {
        alert('Failed to add torrent: ' + err.message);
      }
    }

    // Pause torrent
    async function pauseTorrent() {
      try {
        await fetch('/api/pause', { method: 'POST' });
        updateStats();
      } catch (err) {
        console.error('Pause error:', err);
      }
    }

    // Resume torrent
    async function resumeTorrent() {
      try {
        await fetch('/api/resume', { method: 'POST' });
        updateStats();
      } catch (err) {
        console.error('Resume error:', err);
      }
    }

    // Remove torrent
    async function removeTorrent() {
      if (!confirm('Remove this torrent?')) return;
      
      try {
        await fetch('/api/remove', { method: 'POST' });
        updateStats();
      } catch (err) {
        console.error('Remove error:', err);
      }
    }

    // Update statistics
    async function updateStats() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();
        
        // Update stats cards
        document.getElementById('downloadSpeed').textContent = formatSpeed(data.downloadSpeed);
        document.getElementById('uploadSpeed').textContent = formatSpeed(data.uploadSpeed);
        document.getElementById('activePeers').textContent = data.activePeers;
        document.getElementById('activeTorrents').textContent = (data.status === 'downloading' || data.status === 'paused') ? '1' : '0';
        
        // Update downloads list
        const container = document.getElementById('downloadsList');
        
        if (data.status === 'stopped' || !data.torrentName) {
          container.innerHTML = `
            <div class="empty-state">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
                      d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
              </svg>
              <p>No active torrents</p>
            </div>
          `;
          return;
        }
        
        container.innerHTML = `
          <div class="download-item">
            <div class="download-header">
              <div class="download-name">${escapeHtml(data.torrentName)}</div>
              <span class="download-status status-${data.status}">${data.status}</span>
            </div>
            
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${Math.min(data.progress, 99.9)}%"></div>
            </div>
            
            <div class="download-info">
              <div class="info-item">
                <span>↓</span> <span>${formatBytes(data.downloaded)} / ${formatBytes(data.totalSize)}</span>
              </div>
              <div class="info-item">
                <span>↑</span> <span>${formatBytes(data.uploaded)}</span>
              </div>
              <div class="info-item">
                <span>Peers:</span> <span>${data.activePeers}</span>
              </div>
              <div class="info-item">
                <span>Speed:</span> <span>${formatSpeed(data.downloadSpeed)}</span>
              </div>
            </div>
            
            <div class="download-actions">
              ${data.status === 'downloading' 
                ? `<button class="btn-pause" onclick="pauseTorrent()">Pause</button>`
                : `<button class="btn-resume" onclick="resumeTorrent()">Resume</button>`
              }
              <button class="btn-remove" onclick="removeTorrent()">Remove</button>
            </div>
          </div>
        `;
      } catch (err) {
        console.error('Update error:', err);
      }
    }
          
    // Utility functions
    function formatSpeed(bytes) {
      if (bytes < 1024) return bytes + ' B/s';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB/s';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB/s';
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Enter key to add torrent
    document.getElementById('torrentInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTorrent();
      }
    });

    // Auto-update every 2 seconds
    updateInterval = setInterval(updateStats, 2000);
    updateStats();
    </script>
</body>
</html>
