[package]
name = "smirnovtorrent-gui"
version = "1.0.0"
description = "Desktop GUI for SmirnovTorrent"
authors = ["SmirnovTorrent Team"]
license = "MIT"
repository = "https://github.com/ainsonet/smirnovtorrent"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["dialog-all", "fs-all", "shell-open", "path-all", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
